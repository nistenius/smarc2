# GENERATED by data-cube/scripts/adaptive-inspection/model_inspection_orbit.py — do not
# hand-edit. Every value carries the derivation that produced it; re-run the model after
# changing any input it reads and commit the regenerated file, so a number and its reason
# never drift apart (SETTLED §3k: a hand-picked threshold is how the first farm detector
# produced hundreds of detections per noise ping).
#
# NOTHING HERE IS MEASURED ON A RIG. These are arithmetic defaults over read inputs.
inspection_policy:

  # R >= half_length (1.539 m, SETTLED §3f0d) + R_stop(0.3 m/s) (0.929 m,
  # from obstacle_detector.py's own stop_margin/0.5, stop_t_react/1.0, stop_a_stop/0.35)
  # + sigma (1.0 m, a few minutes of DR) = 3.468 m, rounded UP to the
  # next half metre. A FLOOR: below it the protective stop fires, correctly (invariant 8).
  ring_radius_m: 3.5
  ring_radius_floor_m: 3.468

  # 360/N is the convergence angle between neighbouring views. Photogrammetry tolerates
  # 10-30 deg (strategy §6.2); N=12 gives 30 deg, N=8 gives 45 which is outside it. N is
  # therefore DERIVED from the convergence bound, not chosen: it is the smallest N whose
  # convergence angle is <= 30 deg, i.e. ceil(360/30).
  n_stations: 12
  convergence_deg_max: 30.0

  # Two altitude rings (strategy §5.3): one level with the roof, one a metre higher with
  # the nose pitched down so the roof is covered. The Mini's roof stands
  # 1.278 m above the seabed (SETTLED §3f0d).
  altitudes_m: [1.98, 2.98]

  # The FLS z-band is +/-1.5 m (obstacle_detector.py z_band), so at these altitudes the
  # car's roof is inside the band and the protective stop is ARMED against the thing being
  # orbited. That is deliberate and is why the radius floor above may not be relaxed.
  fls_z_band_m: 1.5

  # 35 s per station x 12 stations x 2 rings, rounded to the
  # strategy's 1200 s. Components: pivot+settle 20 s, burst
  # 5 s, translate 10 s. ALL THREE UNMEASURED
  # (strategy §5.3) — rung R1 replaces them.
  inspection_budget_s: 1200
  station_budget_s: 35

  # Approach speed. R_stop is QUADRATIC in u, so the speed is a safety choice and not a
  # schedule choice: 0.76 m at 0.2, 0.93 m at 0.3,
  # 1.36 m at 0.5 m/s.
  ring_speed_ms: 0.3

  # Beyond this the diversion is refused by distance (strategy §3). 60 m is the operator's
  # policy default from the strategy, NOT a derived number, and is marked as such.
  max_divert_distance_m: 60.0   # POLICY, not derived
  max_diversions: 1             # POLICY, not derived (one car at Asko)
  surface_between: true         # POLICY (D6), not derived

  # Sonar mode commanded at CLOSE-OPS entry and reverted at its exit. The mode switch is
  # the MISSION's, never the sonar's (2026-08-12 decision, AutoSwitch off in the prefab).
  sonar_mode_close_ops: inspection   # 4 m, prefab InsRange
  sonar_mode_scan: navigation        # 15 m, prefab NavRange

  # Read from RealSenseD435i.prefab: 87 x 58 deg.
  camera_hfov_deg: 87.0
  camera_vfov_deg: 58.0

  # Frames a station must produce before the tree calls it done. Evidence, not a
  # stopwatch (SETTLED §3e). 6 = two per second of a 5 s burst at the sim RealSense's
  # 2 Hz raw rate, minus a margin for frames the quality gate rejects.
  min_accepted_frames_per_station: 6
  min_accepted_scans_per_station: 3
